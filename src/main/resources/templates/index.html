<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNS - Rate Notification System</title>
<script>

   Server par deploy karne par bhi safe hai (origin wahi hota hai). */
(function(){
  var REMOTE = "http://45.195.90.145:8089";
  var _fetch = window.fetch;
  window.fetch = function(u, o){

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script th:inline="javascript">
    window.LOGGED_USER = /*[[${username}]]*/ '';
    window.USER_ROLE   = /*[[${role}]]*/ '';
</script>

<style>
:root{
  --navy:#0a0f24;--navy2:#182346;--accent:#4f46e5;--accent-soft:#eef0ff;
  --ink:#0f172a;--text:#334155;--muted:#64748b;--line:#e6eaf2;--bg:#f3f5fa;--card:#fff;
  --ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif}
body{display:flex;height:100vh;background:var(--bg);color:var(--ink);overflow:hidden}

/* ===== APP SIDEBAR ===== */
.app-sidebar{width:264px;flex-shrink:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;
  background:radial-gradient(600px 300px at 0% 0%,#26358a 0%,transparent 60%),linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;font-weight:800;font-size:16px;letter-spacing:.2px}
.brand i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;font-style:normal}
.user-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin-bottom:22px}
.user-name{font-size:14px;font-weight:700;word-break:break-all}
.user-role{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(99,102,241,.35);color:#dfe3ff}
.logout{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:#fca5a5;text-decoration:none}
.logout:hover{color:#fecaca}
.nav-label{font-size:12px;color:#8e9bc7;font-weight:600;padding:0 10px 8px}
.app-sidebar ul{list-style:none}
.app-sidebar ul li{margin-bottom:4px}
.app-sidebar ul li a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;text-decoration:none;color:#c9d1ee;font-size:14.5px;font-weight:600;transition:.15s}
.app-sidebar ul li a .ic{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:15px}
.app-sidebar ul li a:hover{background:rgba(255,255,255,.08);color:#fff}
.app-sidebar ul li a.active{background:#fff;color:var(--navy2)}
.app-sidebar ul li a.active .ic{background:var(--accent-soft)}
.app-sidebar a:focus-visible{outline:2px solid #a5b4fc;outline-offset:2px}

/* ===== MAIN ===== */
.main-content{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:24px 30px 40px}
.topbar{display:flex;align-items:center;padding:20px 26px;margin-bottom:24px;border-radius:16px;color:#fff;font-size:20px;font-weight:800;letter-spacing:.6px;
  background:radial-gradient(500px 200px at 100% 0%,#3b4bb8 0%,transparent 60%),linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 10px 30px rgba(10,15,36,.2)}
.main-content::-webkit-scrollbar,.app-sidebar::-webkit-scrollbar{width:8px}
.main-content::-webkit-scrollbar-thumb{background:#c9d0e0;border-radius:8px}

/* ===== PAGE HEADERS ===== */
.header,.header-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.header h1,.header-bar h1{font-size:24px;font-weight:800;color:var(--ink)}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}
.add-btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:11px;background:linear-gradient(135deg,var(--navy2),var(--accent));color:#fff;text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(79,70,229,.3);transition:.15s}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(79,70,229,.4)}
.search-box{margin-bottom:16px;position:relative;max-width:340px}
.search-box input{width:100%;padding:12px 14px 12px 40px;border-radius:11px;border:1px solid #d5dbe7;background:#fff;font-size:14px;transition:.15s}
.search-box:before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 4px rgba(79,70,229,.14)}

/* ===== TABLES ===== */
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
thead{background:#f7f8fc;color:var(--muted)}
th,td{padding:15px 18px;text-align:left;font-size:14px}
thead th{font-size:12.5px;font-weight:700;letter-spacing:.3px;border-bottom:1px solid var(--line)}
tbody tr{transition:.12s}
tbody td{border-bottom:1px solid #eff2f8}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f7f8ff}
.cell-user{display:flex;align-items:center;gap:12px;font-weight:700}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px;flex-shrink:0}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:4px 10px;border-radius:20px;background:#f1f5f9;color:#334155;font-size:12.5px;font-weight:600}
.icons a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;transition:.15s}
.icons a:hover{background:var(--accent);color:#fff}

.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:20px}
.pagination span{font-size:13px;color:var(--muted);font-weight:600}
.pagination button{padding:9px 18px;border-radius:10px;border:1px solid #d5dbe7;background:#fff;color:var(--navy2);font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.pagination button:hover:not(:disabled){background:var(--navy2);color:#fff;border-color:var(--navy2)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:11px;border:none;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-back{background:#fff;color:var(--navy2);border:1px solid #d5dbe7}
.btn-back:hover{background:#f1f4fa}
.btn-primary{background:linear-gradient(135deg,var(--navy2),var(--accent));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-warning{background:#fff7e6;color:#b45309;border:1px solid #fde1a8}
.btn-warning:hover{background:#fdecc4}
.btn-cancel{background:#eef1f6;color:#334155}
.btn-cancel:hover{background:#e1e6ef}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-save,.save-btn{background:var(--ok);color:#fff}
.btn-save:hover,.save-btn:hover{background:#15803d}
.save-btn{border:none;padding:14px;width:220px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.add-country-btn{margin:15px 0;background:linear-gradient(135deg,var(--navy2),var(--accent));color:#fff;border:none;padding:11px 18px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:700}
.close-btn{background:var(--bad);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700}
.close-btn:hover{background:#b91c1c}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal-actions button{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s}
.rate-actions{display:flex;gap:8px;flex-wrap:wrap}
.rate-btn{padding:8px 13px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;color:#fff;transition:.15s}
.rate-btn:hover{filter:brightness(.92)}
.rate-btn.refresh{background:#0f766e}.rate-btn.send{background:#2563eb}.rate-btn.update{background:#d97706}.rate-btn.delete{background:#dc2626}
.rate-btn:disabled{opacity:.7;cursor:not-allowed}
.btn-loader{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== FORMS ===== */
.form-group{display:flex;flex-direction:column;margin-bottom:18px}
.form-group label,.form-box label{font-weight:700;margin-bottom:7px;font-size:13.5px;color:#334155}
.form-group select,.form-group input,.form-box input[type="text"],.form-box input[type="email"],.form-box select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid #d1d7e3;background:#f8fafc;font-size:14px;transition:.15s}
.form-group select:focus,.form-group input:focus,.form-box input:focus,.form-box select:focus{background:#fff}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}
.form-box{max-width:600px;margin:10px auto;background:#fff;padding:36px 40px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.form-box h2{text-align:center;margin-bottom:22px;font-size:24px;font-weight:800}
.form-box .checkbox-box,.checkbox-box{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-top:6px}
.checkbox-item{display:flex;align-items:center;gap:9px;background:#f4f6fb;border:1px solid #e8ecf5;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s}
.checkbox-item:hover{background:var(--accent-soft);border-color:#c9ceff}
.checkbox-item label{margin:0;cursor:pointer;font-weight:600}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.form-box .btn-box{display:flex;justify-content:space-between;gap:14px;margin-top:8px}
.form-box .btn{flex:1;width:auto;padding:13px 0;font-size:15px;background:linear-gradient(135deg,var(--navy2),var(--accent));color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.form-box .btn:hover{transform:translateY(-2px)}
.steps-indicator{display:flex;justify-content:center;gap:28px;margin-bottom:28px}
.step-item{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:#94a3b8}
.step-circle{width:14px;height:14px;border-radius:50%;background:#cbd5e1;transition:.3s}
.step-circle.active{background:var(--accent);box-shadow:0 0 0 5px rgba(79,70,229,.18)}
.step-circle.active + span{color:var(--ink)}
.step{display:none!important}.step.active{display:block!important}

/* ===== RATES PAGE ===== */
.rates-wrapper{max-width:1100px;margin:0 auto}
.rates-card{background:#fff;border-radius:18px;padding:30px 35px;border:1px solid var(--line);box-shadow:var(--shadow)}
.rates-card h2{font-size:24px;font-weight:800;margin-bottom:24px}
.country-block{border:1px solid var(--line);padding:20px;border-radius:14px;margin-bottom:18px;background:#fafbfe}

/* ===== DETAILS ===== */
.details-card{background:#fff;padding:8px 28px 20px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.details-table,.trunk-table{box-shadow:none;border-radius:0;border:none;background:transparent}
.details-table th{width:230px;padding:16px 12px;color:var(--muted);font-weight:600;font-size:13.5px;background:transparent;border-bottom:1px solid #eff2f8;vertical-align:middle}
.details-table td{padding:14px 12px;border-bottom:1px solid #eff2f8;font-weight:600}
.details-table tr:last-child th,.details-table tr:last-child td{border-bottom:none}
.details-table tr:hover{background:transparent}
.details-table input{width:100%;max-width:420px;padding:10px 12px;border-radius:10px;border:1px solid #d1d7e3;background:#f8fafc;font-size:14px}
.trunk-table{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trunk-table thead th{background:#f7f8fc;padding:11px 14px;font-size:12.5px}
.trunk-table tbody td{padding:12px 14px}
.actions{display:flex;gap:10px;align-items:center}
.actions a{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent-soft);font-size:15px;text-decoration:none;cursor:pointer;transition:.15s}
.actions a:hover{background:#dfe3ff;transform:translateY(-1px)}
.rate-table thead{position:sticky;top:0;background:#f1f4fa}
.rate-table{border-radius:0;box-shadow:none;border:none}
.rate-table th,.rate-table td{padding:10px 14px;font-size:13px}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,36,.55);backdrop-filter:blur(4px);z-index:10000;overflow-y:auto}
.modal-overlay .modal-box{background:#fff;width:92%;max-width:480px;margin:70px auto;padding:24px;border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:scaleIn .22s ease}
.modal-overlay .modal-box.wide{max-width:1000px;height:80vh;margin:40px auto;display:flex;flex-direction:column}
@keyframes scaleIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.modal-box h3{font-size:18px;font-weight:800}
.modal-box label{display:block;margin:12px 0 6px;font-size:13px;font-weight:700;color:#334155}
.update-block{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:#fafbfe}
.update-block h4{margin-bottom:8px;font-size:14px}
.modal-box input[type=text],.modal-box input[type=number],.modal-box input[type=date]{padding:10px 12px;border-radius:10px;border:1px solid #d1d7e3;background:#fff;font-size:14px}

/* ===== DROPDOWNS ===== */
.multi-dd,.multi-dropdown{position:relative}
.dd-header,.dropdown-header{padding:11px 14px;border:1px solid #d1d7e3;border-radius:11px;cursor:pointer;background:#f8fafc;font-size:14px;font-weight:600;transition:.15s}
.dd-header:hover,.dropdown-header:hover{border-color:var(--accent);background:#fff}
.dd-body,.dropdown-body{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:240px;overflow-y:auto;padding:10px;z-index:999;box-shadow:0 18px 40px rgba(15,23,42,.18)}
.dd-body label,.dropdown-body label{display:flex;align-items:center;gap:8px;margin:0;padding:7px 8px;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px}
.dd-body label:hover,.dropdown-body label:hover{background:#f1f4fa}
.dd-search{width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid #d1d7e3;border-radius:9px;font-size:13px}


/* ===== PAGE-SPECIFIC STYLES (rates / reports / promotion form) =====
   .main-content prefix = in pages ke andar ka purana <style> inhe override nahi kar sakta */
html body{background:var(--bg)}
.main-content .rates-wrapper,.main-content .rates-card{overflow:visible}
.main-content .rates-card{position:relative}
.main-content .country-block{position:relative;overflow:visible;contain:none;margin-top:20px;margin-bottom:6px;padding:20px;border:1px solid var(--line);border-radius:14px;background:#fafbfe}
.main-content .delete-country{position:absolute;top:12px;right:12px;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;cursor:pointer;font-size:15px;background:#fef2f2;transition:.15s;z-index:2}
.main-content .delete-country:hover{background:#fee2e2}
.main-content .rates-card .btn.primary,.main-content .email-modal .btn.primary{background:linear-gradient(135deg,var(--navy2),var(--accent));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.main-content .rates-card .btn.primary:hover,.main-content .email-modal .btn.primary:hover{transform:translateY(-1px)}
.main-content .rates-card .btn.primary:disabled,.main-content .email-modal .btn.primary:disabled{opacity:.7;cursor:not-allowed;transform:none}
.main-content .rates-card .btn.secondary,.main-content .email-modal .btn.secondary{background:#fff;color:var(--navy2);border:1px solid #d5dbe7}
.main-content .rates-card .btn.secondary:hover,.main-content .email-modal .btn.secondary:hover{background:#f1f4fa}
.main-content .add-country-btn{margin:0;background:var(--navy2);color:#fff;padding:11px 18px;border-radius:11px;border:none;cursor:pointer;font-weight:700;font-size:14px;transition:.15s}
.main-content .add-country-btn:hover{background:var(--accent)}
.main-content .action-bar{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}

.main-content .dest-btn,.main-content .code-btn,.main-content .country-btn,.main-content .dest-header{width:100%;padding:12px 14px;border-radius:11px;border:1px solid #d1d7e3;background:#f8fafc;cursor:pointer;text-align:left;font-size:14px;font-weight:600;color:var(--ink);transition:.15s}
.main-content .dest-btn:hover,.main-content .code-btn:hover,.main-content .country-btn:hover,.main-content .dest-header:hover{border-color:var(--accent);background:#fff}
.main-content .destination-dropdown,.main-content .country-dropdown,.main-content .client-search-wrapper,.main-content .dest-panel{position:relative}
.main-content .dest-menu,.main-content .country-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;width:100%;max-height:240px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;z-index:999;box-shadow:0 18px 40px rgba(15,23,42,.18);box-sizing:border-box}
.main-content .destination-dropdown.open .dest-menu,.main-content .dest-panel.open .dest-menu,.main-content .country-dropdown.open .country-menu,.main-content .country-menu.open{display:block}
.main-content .code-dropdown{width:100%}
.main-content .code-menu{position:relative;top:auto;margin-top:6px;height:220px;max-height:none;box-shadow:none}
.main-content .code-options label,.main-content .dest-options label,.main-content .dest-menu label{display:flex;align-items:center;gap:8px;margin:0;padding:7px 8px;font-size:13.5px;font-weight:500;border-radius:8px;cursor:pointer;white-space:nowrap}
.main-content .code-options label:hover,.main-content .dest-options label:hover,.main-content .dest-menu label:hover{background:#f1f4fa}
.main-content .dest-menu .select-all,.main-content .dest-select-all-row{font-weight:700;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:4px}
.main-content .dest-menu input[type="checkbox"]{width:16px;height:16px;margin:0;cursor:pointer}
.main-content .country-search{width:100%;padding:9px 10px;margin:0 0 6px;border-radius:9px;border:1px solid #d1d7e3;font-size:13px}
.main-content .country-option,.main-content .client-item{padding:9px 10px;cursor:pointer;font-size:14px;border-radius:8px}
.main-content .country-option:hover,.main-content .client-item:hover{background:var(--accent-soft)}
.main-content .dest-menu::-webkit-scrollbar,.main-content .country-menu::-webkit-scrollbar{width:6px}
.main-content .dest-menu::-webkit-scrollbar-thumb,.main-content .country-menu::-webkit-scrollbar-thumb{background:#c4cbdb;border-radius:6px}
.main-content #clientSearch{width:100%;padding:12px 14px;border-radius:11px;border:1px solid #d1d7e3;background:#f8fafc;font-size:14px}
.main-content .client-list{position:absolute;top:calc(100% + 6px);width:100%;max-height:220px;overflow-y:auto;display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;z-index:999;box-shadow:0 18px 40px rgba(15,23,42,.18)}
.main-content .routing-block{background:#fff;padding:16px 50px 16px 16px;margin-top:14px}
.main-content .routing-row{display:flex;gap:10px;flex-wrap:wrap}
.main-content .routing-row input{flex:1;min-width:140px;padding:11px 12px;border-radius:10px;border:1px solid #d1d7e3;background:#f8fafc;font-size:14px}

.email-overlay{position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(10,15,36,.6);backdrop-filter:blur(4px)}
.main-content .email-modal{position:relative;width:92%;max-width:920px;height:85vh;margin:5vh auto;display:flex;flex-direction:column;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.main-content .email-header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.main-content .email-header h3{margin:0;font-size:16px;font-weight:800}
.main-content .email-close{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;cursor:pointer;opacity:.85;transition:.15s}
.main-content .email-close:hover{opacity:1;background:rgba(255,255,255,.12)}
.main-content .email-meta{padding:14px 22px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:14px}
.main-content .email-meta div{margin:5px 0}
.main-content #emailModal .email-body,.main-content #ratePreviewModal .email-body{flex:1;padding:22px;overflow:auto;font-size:14.5px;line-height:1.65;display:block}
.main-content .email-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfe}
#ratePreviewModal table{width:100%;border:none!important;border-collapse:separate;border-spacing:0;box-shadow:none;border-radius:0}
#ratePreviewModal th,#ratePreviewModal td{border:none;border-bottom:1px solid #eff2f8;padding:10px 14px;font-size:13px}
#ratePreviewModal thead th{position:sticky;top:0;background:#f1f4fa;color:var(--muted)}

.main-content .container{max-width:1040px;margin:0 auto}
.main-content .top-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.main-content .top-bar h3{font-size:22px;font-weight:800}
.main-content .top-actions{display:flex;gap:10px;flex-wrap:wrap}
.main-content .top-actions .btn{padding:10px 18px;border-radius:11px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.15s}
.main-content .top-actions .add-btn{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.main-content .top-actions .add-btn:hover{background:#dfe3ff;transform:none}
.main-content .top-actions .send-btn{background:var(--ok);color:#fff}
.main-content .top-actions .send-btn:hover{background:#15803d}
.main-content .top-actions .back-btn{background:#fff;color:var(--navy2);border:1px solid #d5dbe7}
.main-content .top-actions .back-btn:hover{background:#f1f4fa}
.main-content .form-block{position:relative;background:#fff;padding:18px 52px 18px 20px;border-radius:16px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.main-content .delete-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;display:grid;place-items:center;border:none;border-radius:9px;background:#fef2f2;color:#ef4444;cursor:pointer;font-size:14px;transition:.15s}
.main-content .delete-btn:hover{background:#fee2e2}
.main-content .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.main-content .field{display:flex;flex-direction:column;gap:6px}
.main-content .field-label{font-size:13px;font-weight:700;color:#334155}
.main-content .field input,.main-content .field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid #d1d7e3;background:#f8fafc;font-size:14px;font-weight:500;color:var(--ink)}
.main-content .field textarea{resize:vertical;height:44px;min-height:44px}
@media(max-width:860px){.main-content .grid{grid-template-columns:1fr}}


/* ===== SIDEBAR BOTTOM (profile + logout) & TOPBAR ===== */
.app-sidebar ul li a .ic i{font-size:18px}
.side-bottom{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.side-profile{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:10px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.who{min-width:0}
.who-name{font-size:13px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-role{font-size:11.5px;color:#aab4e6;font-weight:600;margin-top:2px}
.logout-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:11px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;font-size:14px;font-weight:700;text-decoration:none;transition:.15s}
.logout-btn i{font-size:18px}
.logout-btn:hover{background:#ef4444;border-color:#ef4444;color:#fff}
.topbar{justify-content:space-between;gap:12px}
.top-date{max-width:360px;overflow:hidden;text-overflow:ellipsis}
.top-date i{font-size:17px;margin-right:7px;vertical-align:-3px}
.top-date{font-size:13px;font-weight:600;letter-spacing:0;color:#c9d1ee;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:7px 14px;border-radius:30px;white-space:nowrap}


/* ===== ACCOUNT MENU (topbar) + CHANGE PASSWORD ===== */
.acct{position:relative}
.acct-btn{cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;transition:.15s}
.acct-btn:hover,.acct.open .acct-btn{background:rgba(255,255,255,.18);color:#fff}
.acct-btn .acct-mail{overflow:hidden;text-overflow:ellipsis;max-width:260px}
.acct-btn .acct-ch{margin:0 -4px 0 8px;font-size:15px;transition:transform .2s}
.acct.open .acct-ch{transform:rotate(180deg)}
.acct-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:250px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(10,15,36,.22);padding:8px;display:none;z-index:300;letter-spacing:0;font-weight:600}
.acct.open .acct-menu{display:block;animation:acctIn .15s ease}
@keyframes acctIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acct-head{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.acct-head small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.acct-head b{display:block;margin-top:3px;font-size:13.5px;color:var(--ink);word-break:break-all}
.acct-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:transparent;border-radius:9px;font:600 13.5px 'Plus Jakarta Sans',sans-serif;color:#334155;cursor:pointer;text-decoration:none;text-align:left}
.acct-item i{font-size:18px;color:var(--muted)}
.acct-item:hover{background:var(--accent-soft);color:var(--accent)}
.acct-item:hover i{color:var(--accent)}
.acct-item.danger:hover{background:#fef2f2;color:#dc2626}
.acct-item.danger:hover i{color:#dc2626}
.pw-ov{position:fixed;inset:0;background:rgba(10,15,36,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.pw-ov.show{display:flex}
.pw-box{width:100%;max-width:440px;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(10,15,36,.35);overflow:hidden;animation:acctIn .2s ease}
.pw-top{display:flex;align-items:center;gap:13px;padding:22px 26px;border-bottom:1px solid var(--line)}
.pw-ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.pw-top h3{font-size:17px;font-weight:800;color:var(--ink)}
.pw-top p{font-size:12.5px;color:var(--muted);margin-top:2px}
.pw-x{margin-left:auto;width:34px;height:34px;border:none;background:transparent;border-radius:9px;cursor:pointer;color:var(--muted);font-size:20px}
.pw-x:hover{background:#f1f5f9;color:var(--ink)}
.pw-body{padding:22px 26px 6px}
.pw-f{margin-bottom:16px}
.pw-f label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:7px}
.pw-in{position:relative}
.pw-in > i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:18px;color:#94a3b8;pointer-events:none}
.pw-in input{width:100%;padding:12px 44px 12px 40px;border-radius:11px;border:1px solid #d1d7e3;background:#f8fafc;font-size:14px;font-family:inherit}
.pw-in input:focus{background:#fff;outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
.pw-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:transparent;border-radius:9px;cursor:pointer;color:var(--muted);font-size:18px}
.pw-eye:hover{background:#eef1f6;color:var(--accent)}
.pw-msg{display:none;margin:0 26px 4px;padding:11px 14px;border-radius:11px;font-size:13.5px;font-weight:600}
.pw-msg.ok{display:block;background:#ecfdf3;border:1px solid #bbf7d0;color:#15803d}
.pw-msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.pw-foot{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px 22px}
.pw-btn{padding:11px 20px;border-radius:11px;font:700 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;border:1px solid var(--line);background:#fff;color:#334155}
.pw-btn:hover{background:#f8fafc}
.pw-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.28)}
.pw-btn.pri:hover{background:#4338ca}
.pw-btn:disabled{opacity:.6;cursor:not-allowed}

/* ===== PROFESSIONAL POLISH: Rates / Reports / Promotion pages ===== */
.main-content .rates-card{padding:28px 32px 32px}
.main-content .rates-card h2{font-size:22px;font-weight:800;margin:0 0 24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.main-content .rates-card h2::after{content:"Select a client and trunk, then add destinations, codes and rate details";display:block;margin-top:5px;font-size:13.5px;font-weight:500;color:var(--muted)}
.main-content .rates-card:has(#reportBody) h2::after{content:"Filter by client, trunk, date or account manager to review rate activity"}
.main-content .rates-card .form-group label,.main-content .field-label{font-size:12.5px;font-weight:700;color:#475569;letter-spacing:.2px}
#countrySection{counter-reset:dst}
.main-content #countrySection > .country-block:not(.routing-block)::before{counter-increment:dst;content:"Destination " counter(dst);display:block;margin-bottom:16px;padding-right:40px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.main-content .routing-block::before{content:"Routing";display:block;margin-bottom:10px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#0f766e}
.main-content .rates-card:has(#reportBody) > .country-block::before{content:"Filters";display:block;margin-bottom:16px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.main-content .rates-card:has(#reportBody) > .country-block{background:#fafbfe;margin-top:0}
.main-content .rates-card:has(#reportBody) table{display:block;overflow-x:auto;margin-top:28px!important;box-shadow:none;border:1px solid var(--line)}
.main-content .rates-card:has(#reportBody) th{white-space:nowrap;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px;color:#64748b;background:#f7f8fc}
.main-content .rates-card:has(#reportBody) td{font-size:13.5px;color:#334155;vertical-align:middle}
.main-content .rates-card:has(#reportBody) tbody tr:nth-child(even){background:#fbfcfe}
.main-content .rates-card:has(#reportBody) tbody tr:hover{background:#f3f5ff}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.g{background:#ecfdf3;color:#15803d}.st.r{background:#fef2f2;color:#b91c1c}.st.a{background:#fffbeb;color:#b45309}.st.n{background:#f1f5f9;color:#475569}

#formContainer{counter-reset:blk}
.main-content .form-block::before{counter-increment:blk;content:"Promotion " counter(blk);display:block;margin-bottom:14px;padding-right:36px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.main-content .top-bar h3::after{content:"Pick countries and destinations, add quality and offer, then send the promotion mail";display:block;margin-top:4px;font-size:13.5px;font-weight:500;color:var(--muted)}
.promotion-header h2::after{content:"History of promotion mails sent to clients";display:block;margin:4px 0 14px;font-size:13.5px;font-weight:500;color:var(--muted)}
.promotion-table thead th{text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}



/* ===== SIDEBAR PROFILE ROW ===== */
.side-profile{margin-bottom:0;padding:10px 10px 10px 12px;border:1px solid rgba(255,255,255,.1);border-radius:14px}
.who{flex:1}
.logout-ic{margin-left:auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;color:#fca5a5;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);font-size:19px;text-decoration:none;transition:.15s}
.logout-ic:hover{background:#ef4444;border-color:#ef4444;color:#fff;transform:translateY(-1px)}
.app-sidebar ul li a:hover{transform:translateX(3px)}

/* ===== GLOBAL INTERACTION POLISH ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.main-content > div:last-child{animation:fadeUp .35s ease both}
.main-content input:not([type=checkbox]):not([type=radio]):hover,.main-content select:hover,.main-content textarea:hover{border-color:#b3bed6}
.main-content .btn:not(:disabled):hover,.main-content .rate-btn:not(:disabled):hover,.main-content .add-country-btn:hover{transform:translateY(-1px)}
.main-content .rates-card,.main-content .form-box,.main-content .details-card,.main-content .form-block{transition:box-shadow .2s,transform .2s}
.main-content .rates-card:hover,.main-content .form-box:hover,.main-content .details-card:hover{box-shadow:0 2px 4px rgba(15,23,42,.05),0 18px 44px rgba(15,23,42,.1)}
.main-content .form-block:hover{box-shadow:0 14px 34px rgba(15,23,42,.1);transform:translateY(-1px)}
.main-content .country-block{transition:border-color .2s,box-shadow .2s}
.main-content .country-block:hover{border-color:#c7cdf5;box-shadow:0 8px 22px rgba(79,70,229,.08)}
.main-content table tbody tr{transition:background .15s}
.chip{transition:.15s}.chip:hover{background:var(--accent-soft);color:var(--accent)}
.header-bar h1::after{content:"Review contact details, assigned trunks and rate sheets for this client";display:block;margin-top:4px;font-size:13.5px;font-weight:500;color:var(--muted)}

/* ===== REUSABLE PAGE PARTS ===== */
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pg-head h1{font-size:24px;font-weight:800}
.pg-head p{margin-top:4px;color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.1)}
.stat-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.stat-ic.i1{background:#eef0ff;color:#4f46e5}.stat-ic.i2{background:#ecfdf3;color:#16a34a}.stat-ic.i3{background:#fff7e6;color:#d97706}.stat-ic.i4{background:#fef2f2;color:#dc2626}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-title{font-size:15px;font-weight:800}
.panel-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.panel table{border:none;border-radius:0;box-shadow:none}
.panel thead th{text-transform:uppercase;font-size:11.5px;letter-spacing:.5px;background:#f7f8fc}
.panel .pagination{margin:0;padding:14px 22px;border-top:1px solid var(--line);background:#fcfcfe}
.empty-state{text-align:center;padding:52px 20px}
.empty-state i{font-size:42px;color:#b6bfd6}
.empty-state h3{margin-top:10px;font-size:17px;font-weight:800}
.empty-state p{color:var(--muted);font-size:13.5px;margin:6px 0 18px}
.hint{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:500}
.chip.more{background:var(--accent-soft);color:var(--accent)}
.row-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;transition:.15s}
.row-link i{transition:transform .15s}
.row-link:hover{background:var(--accent);color:#fff}
.row-link:hover i{transform:translateX(3px)}
.form-sub{text-align:center;margin:-14px 0 24px;font-size:13.5px;color:var(--muted)}

/* ===== FIELD HELPER LINES (Rates / Reports / Promotion form) ===== */
.main-content .rates-card .form-group > label::after,.main-content .field-label::after{display:block;margin-top:3px;font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted)}
.main-content .rates-card .form-group:has(#clientSearch) > label::after{content:"Search and select the client this rate sheet is for"}
.main-content .rates-card .form-group:has(#trunkDropdown) > label::after{content:"Trunk assigned to the selected client"}
.main-content .rates-card .form-group:has(.country-btn) > label::after{content:"Country whose destinations you want to rate"}
.main-content .rates-card .form-group:has(.dest-btn) > label::after{content:"Pick one or more destinations"}
.main-content .rates-card .form-group:has(.code-btn) > label::after{content:"Select the dialing codes to include"}
.main-content .rates-card .form-group:has(.rate) > label::after{content:"Rate to apply to the selected codes"}
.main-content .rates-card .form-group:has(.billing) > label::after{content:"Billing increment, for example 60/60"}
.main-content .rates-card .form-group:has(.date) > label::after{content:"Date from which the rate applies"}
.main-content .rates-card .form-group:has(.noc-remark) > label::after{content:"Optional note for the NOC team"}
.main-content .rates-card .form-group:has(#clientBtn) > label::after{content:"Leave empty to include all clients"}
.main-content .rates-card .form-group:has(#trunkDD) > label::after{content:"Narrow the report down to one trunk"}
.main-content .rates-card .form-group:has(#fromDate) > label::after{content:"Start of the date range"}
.main-content .rates-card .form-group:has(#toDate) > label::after{content:"End of the date range"}
.main-content .rates-card .form-group:has(#amName) > label::after{content:"Show records handled by this account manager"}
.main-content .field:has(.country-btn) > .field-label::after{content:"Country you want to promote"}
.main-content .field:has(.dest-header) > .field-label::after{content:"One or more destinations"}
.main-content .field:has(input[placeholder="Enter Quality"]) > .field-label::after{content:"Route quality for this offer"}
.main-content .field:has(input[placeholder="Enter Offer"]) > .field-label::after{content:"Offer rate or terms"}
.main-content .field:has(textarea) > .field-label::after{content:"Optional note for the client"}
.main-content .rates-card > .form-row{padding:18px 20px 2px;margin-bottom:6px;border:1px solid var(--line);border-radius:14px;background:#fafbfe}
.main-content .rates-card > .form-row::before{content:"Client and trunk";grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin-bottom:-4px}

/* ===== REPORT RESULTS BAR ===== */
.res-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.res-title{font-size:16px;font-weight:800}
.res-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.res-actions{display:flex;align-items:center;gap:10px}
.res-count{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:20px}
.main-content .rates-card:has(#reportBody) table{margin-top:14px!important}

@media(max-width:860px){
  body{flex-direction:column;height:auto;overflow:auto}
  .app-sidebar{width:100%;height:auto;padding:14px}
  .main-content{height:auto;padding:16px}
  .form-box{padding:24px 20px}.form-row{grid-template-columns:1fr}
  .details-table th{width:130px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="app-sidebar">
  <div class="brand"><i>₹</i> Rate Notification</div>

  <div class="nav-label">Menu</div>
  <ul>
    <li><a th:href="@{'/?page=email'}" th:classappend="${page == null or page == 'email'} ? 'active'"><span class="ic"><i class="ti ti-mail"></i></span>Receive Email</a></li>
    <li><a th:href="@{'/?page=clients'}" th:classappend="${page == 'clients' or page == 'client-details' or page == 'client-add'} ? 'active'"><span class="ic"><i class="ti ti-users"></i></span>Onboarding Clients</a></li>
    <li><a th:href="@{'/?page=rates'}" th:classappend="${page == 'rates'} ? 'active'"><span class="ic"><i class="ti ti-trending-up"></i></span>Rates</a></li>
    <li><a th:href="@{'/?page=trunks'}" th:classappend="${page == 'trunks'} ? 'active'"><span class="ic"><i class="ti ti-chart-bar"></i></span>Reports</a></li>
    <li><a th:href="@{'/?page=promotion'}" th:classappend="${page == 'promotion' or page == 'promotion-form'} ? 'active'"><span class="ic"><i class="ti ti-speakerphone"></i></span>Promotion</a></li>
    <!-- 🔥 ONLY ADMIN -->
    <li th:if="${role == 'SUPER_ADMIN'}">
      <a th:href="@{'/?page=create-user'}" th:classappend="${page == 'create-user'} ? 'active'"><span class="ic"><i class="ti ti-user-plus"></i></span>Create User</a>
    </li>
  </ul>

  <div class="side-bottom">
    <div class="side-profile">
      <div class="av" th:text="${#strings.isEmpty(username) ? '?' : #strings.toUpperCase(#strings.substring(username,0,1))}">U</div>
      <div class="who">

		   console.log("SELECTED 👉", SELECTED_CLIENT, SELECTED_TRUNK);

	    const url =

	/* MODAL */
	function openRateModal(data){
	  const tbody = rateTableBody;
	  tbody.innerHTML = "";

	  let i = 1; // skip header
	  const CHUNK = 100;

	  function renderChunk(){
	    const frag = document.createDocumentFragment();

	    for(let c=0; c<CHUNK && i<data.length; c++, i++){
	      const r = data[i];
	      const tr = document.createElement("tr");
	      tr.innerHTML = `
	        <td>${r.code}</td>
	        <td>${r.destination}</td>
	        <td>${r.rate}</td>
	        <td>${r.status}</td>
	        <td>${r.effectiveDate}</td>
	        <td>${r.billingCycle}</td>

	      frag.appendChild(tr);

	    tbody.appendChild(frag);

	    if(i < data.length){
	      requestAnimationFrame(renderChunk);
	    }
	  }

	  renderChunk();
	  rateModal.style.display="block";
	}

	function closeRateModal() {
	    document.getElementById("rateModal").style.display = "none";
	}
	
	
	
	function openTrunkModal() {
	    document.getElementById("trunkModal").style.display = "block";
	    loadClientTrunks();
	}

	function closeTrunkModal() {
	    document.getElementById("trunkModal").style.display = "none";
	}

	async function loadClientTrunks() {

	    const container = document.getElementById("trunkCheckboxContainer");
	    if (!container) return;

	    container.innerHTML = "Loading...";

	    const existingIds = EXISTING_TRUNKS.map(t => t.id);

	    try {
	        const res = await fetch("http://45.195.90.145:8089/client/getTrunk");
	        const trunks = await res.json();

	        container.innerHTML = "";

	        trunks.forEach(t => {
	            const checked = existingIds.includes(t.id)
	                ? "checked disabled"
	                : "";

	            container.innerHTML += `
	                <label class="checkbox-item">
	                    <input type="checkbox" value="${t.id}" ${checked}>
	                    ${t.name} (${t.prefix})
	                </label>
	            `;
	        });

	    } catch (e) {
	        console.error(e);
	        container.innerHTML = "❌ Failed to load trunks";
	    }
	}

	function saveTrunks() {

	    const clientName = document.getElementById("clientName").value;

	    const selectedTrunks = Array.from(
	        document.querySelectorAll(
	            "#trunkCheckboxContainer input[type=checkbox]:checked:not(:disabled)"
	        )
	    ).map(cb => Number(cb.value));

	    if (selectedTrunks.length === 0) {
	        alert("Select at least one trunk");
	        return;
	    }

	    fetch("http://45.195.90.145:8089/client/addTrunkToClient", {
	        method: "POST",
	        headers: { "Content-Type": "application/json" },
	        body: JSON.stringify({
	            clientName: clientName,
	            trunkIds: selectedTrunks
	        })
	    })
	    .then(() => {
	        closeTrunkModal();
	        location.reload();
	    })
	    .catch(() => alert("❌ Failed to add trunks"));
	}

</script>



<script>
/* topbar date */
(function(){var d=document.getElementById("topDate");if(d){d.textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}})();

/* Reports table: results bar + coloured status badges + CSV export (sirf look, data same) */
(function(){
  var body=document.getElementById("reportBody");
  if(!body) return;
  var tbl=body.closest("table");

  var bar=document.createElement("div");
  bar.className="res-bar";
  bar.innerHTML='<div><div class="res-title">Results</div><div class="res-sub">Rate activity matching your filters</div></div>'+
    '<div class="res-actions"><span class="res-count" id="resCount">0 records</span>'+
    '<button type="button" class="btn btn-back" id="csvBtn"><i class="ti ti-download"></i> Export CSV</button></div>';
  tbl.parentNode.insertBefore(bar,tbl);

  function cls(t){
    t=t.toUpperCase();
    if(/(REJECT|FAIL|DECLIN|ERROR|NOT )/.test(t)) return "r";
    if(/(PEND|WAIT|PROGRESS|HOLD|QUEUE)/.test(t)) return "a";
    if(/(APPROV|SENT|ACCEPT|DONE|SUCCESS|COMPLET|FORWARD|YES)/.test(t)) return "g";
    return "n";
  }
  function enhance(){
    var n=0;
    body.querySelectorAll("tr").forEach(function(tr){
      var td=tr.children;
      if(td.length<8) return;
      n++;
      for(var i=4;i<=7;i++){
        var c=td[i];
        if(c.dataset.done) continue;
        var t=c.textContent.trim();
        if(!t||t==="-"){c.dataset.done=1;continue;}
        c.innerHTML='<span class="st '+cls(t)+'"></span>';
        c.firstChild.textContent=t;
        c.dataset.done=1;
      }
    });
    document.getElementById("resCount").textContent=n+(n===1?" record":" records");
  }
  document.getElementById("csvBtn").onclick=function(){
    var rows=[[].map.call(tbl.querySelectorAll("thead th"),function(t){return t.textContent.trim();})];
    body.querySelectorAll("tr").forEach(function(tr){
      if(tr.children.length<8) return;
      rows.push([].map.call(tr.children,function(c){return c.textContent.trim();}));
    });
    if(rows.length<2){alert("No records to export");return;}
    var csv=rows.map(function(r){return r.map(function(v){return '"'+v.replace(/"/g,'""')+'"';}).join(",");}).join("\n");
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
    a.download="rate-report.csv";
    document.body.appendChild(a);a.click();a.remove();
  };
  new MutationObserver(enhance).observe(body,{childList:true});
  enhance();
})();
</script>


<!-- CHANGE PASSWORD -->
<div class="pw-ov" id="pwOv">
  <div class="pw-box" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <div class="pw-top">
      <div class="pw-ic"><i class="ti ti-key"></i></div>
      <div><h3 id="pwTitle">Change password</h3><p>Enter your current password, then choose a new one.</p></div>
      <button type="button" class="pw-x" id="pwClose" aria-label="Close"><i class="ti ti-x"></i></button>
    </div>
    <form id="pwForm" autocomplete="off">
      <div class="pw-body">
        <div class="pw-f"><label for="pwOld">Current password</label>
          <div class="pw-in"><i class="ti ti-lock"></i><input id="pwOld" type="password" placeholder="Enter current password" autocomplete="current-password" required><button type="button" class="pw-eye" data-t="pwOld"><i class="ti ti-eye"></i></button></div></div>
        <div class="pw-f"><label for="pwNew">New password</label>
          <div class="pw-in"><i class="ti ti-lock-plus"></i><input id="pwNew" type="password" placeholder="Enter new password" autocomplete="new-password" required><button type="button" class="pw-eye" data-t="pwNew"><i class="ti ti-eye"></i></button></div></div>
        <div class="pw-f"><label for="pwCon">Confirm new password</label>
          <div class="pw-in"><i class="ti ti-lock-check"></i><input id="pwCon" type="password" placeholder="Re-enter new password" autocomplete="new-password" required><button type="button" class="pw-eye" data-t="pwCon"><i class="ti ti-eye"></i></button></div></div>
      </div>
      <div class="pw-msg" id="pwMsg"></div>
      <div class="pw-foot">
        <button type="button" class="pw-btn" id="pwCancel">Cancel</button>
        <button type="submit" class="pw-btn pri" id="pwSave">Update password</button>
      </div>
    </form>
  </div>
</div>
<script>
(function(){
  var acct=document.getElementById("acct"),btn=document.getElementById("acctBtn");
  var ov=document.getElementById("pwOv"),form=document.getElementById("pwForm"),msg=document.getElementById("pwMsg"),save=document.getElementById("pwSave");
  if(!acct||!ov)return;
  function setOpen(o){acct.classList.toggle("open",o);btn.setAttribute("aria-expanded",o)}
  btn.addEventListener("click",function(e){e.stopPropagation();setOpen(!acct.classList.contains("open"))});
  document.addEventListener("click",function(e){if(!acct.contains(e.target))setOpen(false)});
  function openM(){setOpen(false);form.reset();msg.className="pw-msg";ov.classList.add("show");setTimeout(function(){document.getElementById("pwOld").focus()},50)}
  function closeM(){ov.classList.remove("show")}
  document.getElementById("openPwd").addEventListener("click",openM);
  document.getElementById("pwClose").addEventListener("click",closeM);
  document.getElementById("pwCancel").addEventListener("click",closeM);
  ov.addEventListener("click",function(e){if(e.target===ov)closeM()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeM();setOpen(false)}});
  Array.prototype.forEach.call(document.querySelectorAll(".pw-eye"),function(b){
    b.addEventListener("click",function(){var i=document.getElementById(b.getAttribute("data-t"));var show=i.type==="password";i.type=show?"text":"password";b.firstChild.className="ti "+(show?"ti-eye-off":"ti-eye")});
  });
  function show(t,c){msg.textContent=t;msg.className="pw-msg "+c}
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var o=document.getElementById("pwOld").value,n=document.getElementById("pwNew").value,c=document.getElementById("pwCon").value;
    if(n.length<6){show("New password must be at least 6 characters.","err");return}
    if(n!==c){show("New password and confirm password do not match.","err");return}
    if(n===o){show("New password must be different from the current one.","err");return}
    save.disabled=true;
    fetch("/change-password",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({currentPassword:o,newPassword:n,confirmPassword:c}).toString()})
    .then(function(r){
      if(r.status===404){show("Password change is not enabled on the server yet.","err");return}
      if(r.status===400||r.status===401||r.status===403){show("Current password is incorrect.","err");return}
      if((r.url||"").indexOf("login")>-1){show("Your session has expired. Please sign in again.","err");return}
      if(!r.ok){show("Could not update the password. Please try again.","err");return}
      show("Password updated successfully.","ok");form.reset();setTimeout(closeM,1400);
    })
    .catch(function(){show("Could not reach the server. Please try again.","err")})
    .finally(function(){save.disabled=false});
  });
})();
</script>
</body>
